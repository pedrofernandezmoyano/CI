name: Angular CI/CD

# Se ejecuta en PRs hacia main (CI) y en pushes a main (CI + CD)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # Permiso mínimo de lectura del código para compilar
    permissions:
      contents: read
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node 22 y caché de npm
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias exactas
        run: npm ci

      - name: Compilar aplicación Angular
        # Sustituye <repo> por el nombre de tu repositorio en GitHub
        run: npx ng build --base-href /<repo>/

      - name: Subir artefacto de GitHub Pages
        # Solo se sube en push (no en pull_request)
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          # Ajusta la ruta si tu angular.json saca el build a dist/<proyecto> en vez de .../browser
          path: dist/<tu-proyecto>/browser

  deploy:
    # Espera a que termine build y solo corre en push a main
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Permisos necesarios para publicar en GitHub Pages y autenticar con OIDC
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4